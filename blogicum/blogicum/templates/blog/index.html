<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лента записей</title>
</head>
<body>
    <h1>Лента записей</h1>
    
    {% for post in posts %}
        <div>
            <ul>
                <li>Место: {{ post.location }}</li>
                <li>Дата: {{ post.date }}</li>
                <li>Категория: {{ post.category }}</li>
            </ul>
            <p>{{ post.text|slice:":20" }}</p>
            <a href="{% url 'blog:post_detail' post.id %}">Читать полный текст</a>
        </div>
        {% if not forloop.last %}<hr>{% endif %}
    {% endfor %}
</body>
</html>
