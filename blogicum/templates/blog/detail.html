{% extends "base.html" %}

{% block title %}
  {{ post.title }}
{% endblock %}

{% block content %}
  <h1>{{ post.title }}</h1>
  <p>
    {{ post.location.name }} | 
    {{ post.pub_date|date:"d E Y" }} | 
    <a href="{% url 'blog:category_posts' post.category.slug %}">{{ post.category.title }}</a>
  </p>
  <p>{{ post.text|linebreaks }}</p>
{% endblock %}
